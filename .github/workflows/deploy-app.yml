name: Deploy app (reusable)

# Called by a first-party app repo's own thin caller workflow (e.g.
# lazaretto's deploy-develop.yml). Builds+pushes that app's image(s) to
# GHCR, then reconciles it into the target environment via the `quarantine`
# CLI (QuarantineAl/platform, already checked out at /opt/quarantine/repo on
# the runner host — see platform/install.sh). Runs on the shared,
# ephemeral, trusted-only runner pool — never for untrusted/fork-PR code.
#
# Assumes a two-image app shape (backend + frontend), matching lazaretto
# today. If a future first-party app has a different shape, this workflow
# needs a per-app branch, not a rewrite — keep it generic where possible.

on:
  workflow_call:
    inputs:
      app:
        description: Catalog/profile name in platform's catalog.yaml (e.g. "lazaretto")
        required: true
        type: string
      environment:
        description: Target quarantine environment name (e.g. "dev")
        required: true
        type: string
      ref:
        description: Commit SHA to deploy
        required: true
        type: string

env:
  QUARANTINE_REPO_PATH: /opt/quarantine/repo

jobs:
  deploy:
    runs-on: [self-hosted, quarantine-dev]
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4
        with:
          repository: QuarantineAl/${{ inputs.app }}
          ref: ${{ inputs.ref }}
          path: app

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # lazaretto-specific: frontend/Dockerfile deliberately reads only
      # frontend/.env.production (never a build ARG/ENV — an already-set
      # process.env value, even empty, silently wins over the .env file, see
      # that Dockerfile's own comment). Rewriting the file before build is
      # the supported way to point a build at this environment's API host.
      - name: Point frontend build at this environment's API host
        if: inputs.app == 'lazaretto'
        run: |
          api_host="${{ inputs.app }}-api.${{ inputs.environment == 'dev' && 'dev.quarantine.al' || 'quarantine.al' }}"
          echo "VITE_API_BASE=https://${api_host}" > app/frontend/.env.production

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: app/backend
          push: true
          tags: |
            ghcr.io/quarantineal/${{ inputs.app }}-backend:${{ inputs.environment }}
            ghcr.io/quarantineal/${{ inputs.app }}-backend:${{ inputs.ref }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: app/frontend
          push: true
          tags: |
            ghcr.io/quarantineal/${{ inputs.app }}-frontend:${{ inputs.environment }}
            ghcr.io/quarantineal/${{ inputs.app }}-frontend:${{ inputs.ref }}

      # bin/quarantine requires sops/age-keygen/yq on whatever machine runs
      # it. install.sh puts those on the VM itself, but this step runs
      # *inside* the ephemeral runner container (a bare myoung34/github-
      # runner image) — confirmed missing live: "ERROR: missing required
      # command(s): sops age-keygen". Same pinned versions/checksums as
      # platform/install.sh, so both installs stay in lockstep; revisit if
      # that file's own PIN CHECKPOINT ever moves.
      - name: Install quarantine CLI dependencies
        run: |
          case "$(uname -m)" in
            x86_64) arch=amd64 ;;
            aarch64|arm64) arch=arm64 ;;
            *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac

          sudo apt-get update -qq
          sudo apt-get install -y -qq age

          sops_version="3.13.3"
          yq_version="4.53.3"
          declare -A sops_sha256=( [amd64]="e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b" [arm64]="53b0abacd38ef1b12a66d6c100956691b9cefce018d91f81e73ddf7438b94d77" )
          declare -A yq_sha256=( [amd64]="fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4" [arm64]="578648e463a11c1b6db6010cbf41eafed6bee79466fcffa1bb446672cf7945ea" )

          fetch_verified() {
            local url="$1" expected="$2" dest="$3" tmp actual
            tmp="$(mktemp)"
            curl -fsSL -o "$tmp" "$url"
            actual="$(sha256sum "$tmp" | awk '{print $1}')"
            [[ "$actual" == "$expected" ]] || { echo "checksum mismatch for ${url}: expected ${expected}, got ${actual}" >&2; exit 1; }
            chmod +x "$tmp"
            sudo mv "$tmp" "$dest"
          }

          fetch_verified "https://github.com/getsops/sops/releases/download/v${sops_version}/sops-v${sops_version}.linux.${arch}" "${sops_sha256[$arch]}" /usr/local/bin/sops
          fetch_verified "https://github.com/mikefarah/yq/releases/download/v${yq_version}/yq_linux_${arch}" "${yq_sha256[$arch]}" /usr/local/bin/yq

      - name: Reconcile via quarantine CLI
        working-directory: ${{ env.QUARANTINE_REPO_PATH }}
        env:
          QUARANTINE_CONFIG_FILE: /opt/quarantine/quarantine.yaml
        run: |
          git pull --ff-only
          ./bin/quarantine app add ${{ inputs.app }} --version ${{ inputs.environment }}
          ./bin/quarantine start
