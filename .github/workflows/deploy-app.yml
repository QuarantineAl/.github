name: Deploy app (reusable)

# Called by a first-party app repo's own thin caller workflow (e.g.
# lazaretto's deploy-develop.yml). Builds+pushes that app's image(s) to
# GHCR, then reconciles it into the target environment via the `quarantine`
# CLI (QuarantineAl/platform, already checked out at /opt/quarantine/repo on
# the runner host — see platform/install.sh). Runs on the shared,
# ephemeral, trusted-only runner pool — never for untrusted/fork-PR code.
#
# Assumes a two-image app shape (backend + frontend), matching lazaretto
# today. If a future first-party app has a different shape, this workflow
# needs a per-app branch, not a rewrite — keep it generic where possible.

on:
  workflow_call:
    inputs:
      app:
        description: Catalog/profile name in platform's catalog.yaml (e.g. "lazaretto")
        required: true
        type: string
      environment:
        description: Target quarantine environment name (e.g. "dev")
        required: true
        type: string
      ref:
        description: Commit SHA to deploy
        required: true
        type: string
      # Opt-in, and off by default, because per-tenant instances are a
      # lazaretto concept rather than a property of every first-party app —
      # the caller that has tenants declares it, and this workflow stays
      # generic. See the step at the bottom for what it actually does.
      upgrade_tenants:
        description: After the shared instance, roll the new image out to every per-tenant instance too
        required: false
        default: false
        type: boolean
      # Opt-in for the same reason as upgrade_tenants: a release marks "this
      # is what prod is serving", so only the caller knows which of its
      # environments deserves one. Defaulting to false also means merging
      # this workflow changes nothing until a caller asks for it.
      create_release:
        description: After a successful deploy, tag the deployed SHA and publish a GitHub Release on the calling repo
        required: false
        default: false
        type: boolean

env:
  QUARANTINE_REPO_PATH: /opt/quarantine/repo

jobs:
  deploy:
    runs-on: [self-hosted, "quarantine-${{ inputs.environment }}"]
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4
        with:
          repository: QuarantineAl/${{ inputs.app }}
          ref: ${{ inputs.ref }}
          path: app

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # NOTE: there is deliberately no step here writing VITE_API_BASE into
      # frontend/.env.production, and re-adding one would break per-tenant
      # deployments.
      #
      # This workflow used to bake an API host into the lazaretto frontend
      # bundle before building. It no longer needs to: lazaretto's
      # frontend/src/lib/api.ts derives its API host from the page's own
      # hostname at runtime, using the <sub>.<domain> -> <sub>-api.<domain>
      # pairing that the platform's compose fragment guarantees by templating
      # both hostnames off one SUBDOMAIN. The derived value is byte-for-byte
      # what this step used to write, for both environments:
      #   dev  -> lazaretto.dev.quarantine.al  =>  lazaretto-api.dev.quarantine.al
      #   prod -> lazaretto.quarantine.al      =>  lazaretto-api.quarantine.al
      #
      # Removing it is what makes ONE image serve every host it is deployed
      # under. That matters because per-tenant Lazaretto instances
      # (quarantine tenant add, platform's provisioners/lazaretto-tenant.sh)
      # all run this same :dev/:prod image under their own hostnames — with a
      # host baked in, every tenant's frontend would call the shared
      # deployment's API instead of its own, and onboarding a tenant would
      # otherwise require a CI image build per tenant.
      #
      # VITE_API_BASE is still honoured as an explicit override if a future
      # deployment ever breaks the sibling-subdomain convention; it just is
      # not set by default. See lazaretto's frontend/.env.production.
      #
      # BUILD_SHA puts the deployed commit inside the images, so a running
      # deployment can say what it is: the backend reports it from GET /health
      # and the frontend shows it in the nav. Everything else that knows the
      # SHA — the image tag, the release, this log — is outside the thing
      # actually serving traffic, and answering "what is running right now"
      # from outside is exactly what was not possible before.
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: app/backend
          push: true
          build-args: |
            BUILD_SHA=${{ inputs.ref }}
          tags: |
            ghcr.io/quarantineal/${{ inputs.app }}-backend:${{ inputs.environment }}
            ghcr.io/quarantineal/${{ inputs.app }}-backend:${{ inputs.ref }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: app/frontend
          push: true
          build-args: |
            BUILD_SHA=${{ inputs.ref }}
          tags: |
            ghcr.io/quarantineal/${{ inputs.app }}-frontend:${{ inputs.environment }}
            ghcr.io/quarantineal/${{ inputs.app }}-frontend:${{ inputs.ref }}

      # bin/quarantine requires sops/age-keygen/yq on whatever machine runs
      # it. install.sh puts those on the VM itself, but this step runs
      # *inside* the ephemeral runner container (a bare myoung34/github-
      # runner image) — confirmed missing live: "ERROR: missing required
      # command(s): sops age-keygen". sops/yq versions+checksums match
      # platform/install.sh so both installs stay in lockstep; revisit if
      # that file's own PIN CHECKPOINT ever moves. age is pinned/verified
      # separately here (install.sh gets it via apt, but this runner's base
      # image ships without the `universe` component enabled — confirmed
      # live: "E: Unable to locate package age" — so it's fetched the same
      # checksum-verified way as sops/yq instead of depending on apt config
      # install.sh doesn't need to care about on a real host).
      - name: Install quarantine CLI dependencies
        run: |
          case "$(uname -m)" in
            x86_64) arch=amd64 ;;
            aarch64|arm64) arch=arm64 ;;
            *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac

          sops_version="3.13.3"
          yq_version="4.53.3"
          age_version="1.3.1"
          declare -A sops_sha256=( [amd64]="e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b" [arm64]="53b0abacd38ef1b12a66d6c100956691b9cefce018d91f81e73ddf7438b94d77" )
          declare -A yq_sha256=( [amd64]="fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4" [arm64]="578648e463a11c1b6db6010cbf41eafed6bee79466fcffa1bb446672cf7945ea" )
          declare -A age_sha256=( [amd64]="bdc69c09cbdd6cf8b1f333d372a1f58247b3a33146406333e30c0f26e8f51377" [arm64]="c6878a324421b69e3e20b00ba17c04bc5c6dab0030cfe55bf8f68fa8d9e9093a" )

          fetch_verified() {
            local url="$1" expected="$2" dest="$3" tmp actual
            tmp="$(mktemp)"
            curl -fsSL -o "$tmp" "$url"
            actual="$(sha256sum "$tmp" | awk '{print $1}')"
            [[ "$actual" == "$expected" ]] || { echo "checksum mismatch for ${url}: expected ${expected}, got ${actual}" >&2; exit 1; }
            chmod +x "$tmp"
            sudo mv "$tmp" "$dest"
          }

          fetch_verified "https://github.com/getsops/sops/releases/download/v${sops_version}/sops-v${sops_version}.linux.${arch}" "${sops_sha256[$arch]}" /usr/local/bin/sops
          fetch_verified "https://github.com/mikefarah/yq/releases/download/v${yq_version}/yq_linux_${arch}" "${yq_sha256[$arch]}" /usr/local/bin/yq

          age_tmp="$(mktemp -d)"
          age_tarball="${age_tmp}/age.tar.gz"
          curl -fsSL -o "$age_tarball" "https://github.com/FiloSottile/age/releases/download/v${age_version}/age-v${age_version}-linux-${arch}.tar.gz"
          actual="$(sha256sum "$age_tarball" | awk '{print $1}')"
          [[ "$actual" == "${age_sha256[$arch]}" ]] || { echo "checksum mismatch for age tarball: expected ${age_sha256[$arch]}, got ${actual}" >&2; exit 1; }
          tar xzf "$age_tarball" -C "$age_tmp"
          sudo mv "${age_tmp}/age/age" "${age_tmp}/age/age-keygen" /usr/local/bin/
          rm -rf "$age_tmp"

      # The compose `up` resolves the SHA tag, not `:${{ inputs.environment }}`.
      # Both name the same image the instant this job runs, but only the SHA
      # still does a minute later — `:dev`/`:prod` are reassigned by every
      # subsequent deploy. Pulling through the floating tag left a real race:
      # between the push above and the `up` below, a second merge can move
      # `:prod`, and this job would then deploy a build it did not make, while
      # reporting success for the commit it was handed.
      #
      # `app add` deliberately still records `${{ inputs.environment }}` in the
      # manifest rather than the SHA. environments/<env>/manifest.yaml is
      # git-tracked and meant to be committed (see platform/.gitignore), and
      # the hosts run this job in their own checkout at
      # ${{ env.QUARANTINE_REPO_PATH }}. Writing a fresh SHA on every deploy
      # would leave that file permanently modified there, so the moment anyone
      # commits a manifest change upstream — adding an app, as SearXNG did —
      # the `git pull --ff-only` above aborts on the conflict and an unrelated
      # repo's deploy fails. Recording the environment tag keeps the write
      # idempotent and the tree clean.
      #
      # The cost is that a later `quarantine start` reconciles the shared
      # instance back through `:${{ inputs.environment }}`, i.e. forward to
      # whatever is newest, rather than holding this SHA. That is the
      # pre-existing behaviour, not something introduced here — but it is why
      # the SHA has to be recorded somewhere a human can find it, which is
      # what the release job below is for. Making the manifest itself hold the
      # SHA needs CI to commit and push it, and that needs the hosts to stop
      # carrying uncommitted environments/ edits first.
      #
      # Deliberately NOT `quarantine start`: that reconciles the WHOLE
      # environment (traefik, postgres, zitadel, observability, the CI
      # runner pool itself, ...), which a routine app deploy has no reason
      # to touch — and when invoked from a job running ON the runner it
      # would reconcile, a runner recreate kills the job doing the
      # recreating (confirmed live: "The operation was canceled").
      # `quarantine app add` still runs, for manifest.yaml/GitOps
      # bookkeeping. Bringing the app's own container(s) up is then a
      # directly-scoped `docker compose up`, same pattern pr-sandbox-up.yml
      # already uses for PR previews — just against the persistent
      # environment project instead of an isolated pr-<n> one, so it joins
      # the existing quarantine-<env> stack rather than starting a second
      # disconnected one. Traefik's `--providers.docker` watches the Docker
      # socket for container events live, so it picks up the new/replaced
      # container's routing labels with no restart of its own.
      - name: Deploy app's own service(s) only
        working-directory: ${{ env.QUARANTINE_REPO_PATH }}
        env:
          QUARANTINE_CONFIG_FILE: /opt/quarantine/quarantine.yaml
        run: |
          git pull --ff-only
          ./bin/quarantine app add ${{ inputs.app }} --version ${{ inputs.environment }}

          export DOMAIN="$(yq eval '.domain' "$QUARANTINE_CONFIG_FILE")"
          version_var="$(printf '%s' "${{ inputs.app }}" | tr '[:lower:]-' '[:upper:]_')_VERSION"
          export "${version_var}=${{ inputs.ref }}"
          docker compose \
            --project-name "quarantine-${{ inputs.environment }}" \
            -f "apps/first-party/${{ inputs.app }}/compose.yaml" \
            --profile "${{ inputs.app }}" \
            up -d

      # Per-tenant instances run under their own Compose project names
      # (quarantine-lazaretto-<tenant>), so the scoped `up` above — which
      # targets quarantine-<env> and nothing else — deliberately never touches
      # them. Nothing else does either: they sit outside `quarantine start`'s
      # reconciliation loop by design. Without this step a tenant simply keeps
      # serving whatever image it was created with, indefinitely.
      #
      # Ordered after the shared deploy on purpose. The shared instance is the
      # canary: it takes the new image first, and a rollout that only starts
      # once it is up has already had one real-world verification. From there
      # `upgrade-all` goes tenant by tenant, each one proven healthy before the
      # next is recreated (platform's tenant_up passes --wait), aborting the
      # whole loop on the first failure — so a bad image costs one tenant, not
      # the fleet.
      #
      # Recreating a tenant's backend KILLS any coding agent turn in flight
      # there. That is accepted rather than drained: tenants are single-
      # occupant today and an interrupted turn is recoverable. Revisit if a
      # tenant ever holds a real team.
      #
      # The SHA is passed explicitly for the same reason the step above pulls
      # through it, and it sticks better here. Each tenant stores its own
      # version in tenant.conf, so with no argument upgrade-all keeps
      # whatever is written there — the floating `:<environment>` tag — and
      # merely re-pulls it, which is a live race against any build that
      # publishes mid-rollout, and a fleet that can end up split across two
      # images with nothing recording which is which.
      #
      # Unlike the manifest, tenant.conf lives OUTSIDE the repo (under
      # $QUARANTINE_TENANTS_DIR, see the provisioner's header), so writing a
      # new SHA here every deploy dirties no git-tracked file and cannot
      # break the next `git pull --ff-only`. It also survives: nothing
      # reconciles tenants back to a floating tag the way `quarantine start`
      # would for the shared instance, so a tenant stays on the exact build
      # it was given until something upgrades it. `tenant list` reports it
      # too — that column reads the running image, and it said "prod" for
      # every tenant before this.
      - name: Roll the new image out to per-tenant instances
        if: ${{ inputs.upgrade_tenants }}
        working-directory: ${{ env.QUARANTINE_REPO_PATH }}
        env:
          QUARANTINE_CONFIG_FILE: /opt/quarantine/quarantine.yaml
        run: ./bin/quarantine tenant upgrade-all ${{ inputs.ref }}

  # Runs only after `deploy` succeeds, so a release means "this is what the
  # environment is serving" rather than "this compiled". Nothing here can
  # affect the deployment; the worst case is a deployed environment with no
  # release row, which is recoverable by hand.
  #
  # GitHub-hosted rather than the self-hosted pool: this only talks to the
  # API, and it should not queue behind — or run beside — the runners that
  # exist to touch the environment.
  # Needs `contents: write`, which the CALLER has to grant — see lazaretto's
  # deploy-main.yml. There is deliberately no `permissions:` block here:
  # a called workflow can only ever downgrade what the caller passed down, so
  # asking for write from inside would be an escalation for every existing
  # caller that grants `contents: read` — and permissions are resolved when
  # the job is created, which is not obviously after `if:` is evaluated. A
  # caller that sets create_release without widening its own permissions gets
  # a failed release job and a deployed environment, which is the right way
  # round for the two to fail.
  release:
    needs: deploy
    if: ${{ inputs.create_release }}
    runs-on: ubuntu-latest
    steps:
      # `github.*` in a reusable workflow is the CALLER's context, so
      # github.repository is the app repo (e.g. QuarantineAl/lazaretto) and
      # the release lands there, next to the code it was built from. No
      # checkout: everything below is API-only, and `gh` reads GH_REPO.
      - name: Tag the deployed commit and publish a release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ inputs.ref }}
          APP: ${{ inputs.app }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail

          # CalVer, not semver, and deliberately. Semver's job is to tell
          # consumers which upgrades are safe to take, and this app has no
          # consumers who choose: every instance, shared and per-tenant, is
          # rolled by the job above. A major/minor/patch decision here would
          # be a number nobody can act on — and deriving one automatically
          # would mean conventional commits, which this org does not write.
          # A date answers the question that does get asked: when did this
          # ship, and what was on prod at the time.
          day="$(date -u +%Y.%m.%d)"

          # Sequence within the day, taken from the highest existing tag
          # rather than a count, so a deleted tag cannot hand out a number
          # that is already in use. matching-refs returns [] (not 404) when
          # nothing matches, which is the first release of the day.
          n="$(gh api "repos/${GH_REPO}/git/matching-refs/tags/v${day}-" \
                 --jq '[.[].ref | split("-") | last | tonumber] | max // 0')"
          tag="v${day}-$(( n + 1 ))"
          echo "Releasing ${tag} at ${SHA}"

          # Generated from the PRs merged since the last release, by commit
          # ancestry — which is why it works here despite the org merging
          # rather than squashing: PR titles never reach commit subjects, and
          # nothing below parses a commit message.
          notes="$(gh api "repos/${GH_REPO}/releases/generate-notes" \
                     -f tag_name="$tag" -f target_commitish="$SHA" --jq .body)"

          # The rollback recipe is in the body on purpose. The SHA tag is the
          # only durable handle on this build — `:${ENVIRONMENT}` will have
          # moved by the time anyone needs it — so the release row is where
          # someone under pressure can find both the identifier and what to
          # do with it, without reconstructing either from Actions history.
          # Backticks are escaped because this heredoc is unquoted — it has to
          # be, to interpolate the values — so an unescaped one would run as
          # command substitution instead of rendering a markdown code span.
          # $notes is expanded once, here; its own content is not rescanned,
          # so nothing a PR title contains can execute.
          cat > "${RUNNER_TEMP}/notes.md" <<EOF
          Deployed to **${ENVIRONMENT}** from \`${SHA}\`.

          ### Images

              ghcr.io/quarantineal/${APP}-backend:${SHA}
              ghcr.io/quarantineal/${APP}-frontend:${SHA}

          ### Roll back to this build

          On the ${ENVIRONMENT} host, in \`/opt/quarantine/repo\`:

              ./bin/quarantine app add ${APP} --version ${SHA}
              ./bin/quarantine start
              ./bin/quarantine tenant upgrade-all ${SHA}

          The first two pin and apply the shared instance; the third rolls the
          per-tenant instances, which sit outside \`start\`'s reconciliation
          loop — drop it if this app has no tenants. Note that \`app add\` edits
          the tracked manifest, so commit it or the next deploy's \`git pull\`
          may conflict.

          ---

          ${notes}
          EOF

          gh release create "$tag" \
            --target "$SHA" \
            --title "$tag" \
            --notes-file "${RUNNER_TEMP}/notes.md"
