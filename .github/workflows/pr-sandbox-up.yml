name: PR sandbox up (reusable)

# Called on pull_request opened/synchronize/reopened. Builds+pushes a
# pr-<n>-tagged image, then brings up an isolated sandbox directly via
# `docker compose -p pr-<n>-<app>` — deliberately NOT through `quarantine
# app add`/manifest.yaml, since a PR sandbox is ephemeral, workflow-driven
# state, not the environment's committed desired state. The Compose project
# name is the whole isolation unit (own containers/network/volume) — see
# platform/docs/runners-and-sandboxing.md.
#
# Reuses the same catalog compose fragment
# (apps/first-party/<app>/compose.yaml) as the persistent catalog app, on
# the `edge` network so Traefik's existing label-based discovery picks it
# up with no new mechanism. Requires that fragment to template its Host()
# rules off a SUBDOMAIN var rather than a literal name — see platform's own
# apps/first-party/lazaretto/compose.yaml.
#
# If <app>'s catalog.yaml entry has needs_oidc: true, this ALSO brings up
# that app's own oauth2-proxy-<app> instance (infra/edge/oauth2-proxy/
# compose.yaml — its ${SUBDOMAIN}-templated block, one instance per open PR
# sandbox) as part of the SAME compose project, and registers this
# sandbox's own redirect URI on the app's shared Zitadel Application via
# `quarantine app add-redirect` (platform/bin/quarantine — wraps
# provisioners/zitadel.sh's flock-serialized read-modify-write, since
# Zitadel has no per-URI add/remove RPC). This is driven entirely by
# catalog.yaml's own needs_oidc flag, not a hardcoded app name — a future
# PR-sandboxed app gets this for free by setting needs_oidc: true and
# following platform/docs/adding-oidc-to-your-app.md's recipe, with no
# edit to this workflow.
#
# `environment` picks which environment's runner pool/host this sandbox
# lands on ("dev" or "prod", never anything else) — the caller workflow
# decides this from the PR's *base* branch (develop -> dev, main -> prod),
# not from anything in this workflow. dev's sandboxes get hostnames one
# level below dev.quarantine.al; prod's get hostnames one level below the
# bare quarantine.al root — both already covered by that environment's own
# wildcard cert with zero extra DNS/ACME work (see
# platform/docs/runners-and-sandboxing.md).

on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      environment:
        description: Target quarantine environment name ("dev" or "prod") — picks the runner pool and the base domain a PR hostname is built under
        required: true
        type: string
      pr_number:
        required: true
        type: string
      ref:
        required: true
        type: string

env:
  QUARANTINE_REPO_PATH: /opt/quarantine/repo

jobs:
  up:
    runs-on: [self-hosted, "quarantine-${{ inputs.environment }}"]
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4
        with:
          repository: QuarantineAl/${{ inputs.app }}
          ref: ${{ inputs.ref }}
          path: app

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # NOTE: no step writes VITE_API_BASE into frontend/.env.production here
      # either — see the matching note in deploy-app.yml for the full
      # rationale. lazaretto's frontend derives its API host from the page's
      # own hostname at runtime, and for a PR sandbox that derivation is
      # exactly what this step used to write:
      #   pr-<n>-lazaretto.dev.quarantine.al
      #     => pr-<n>-lazaretto-api.dev.quarantine.al
      # Dropping it keeps this reusable workflow free of a lazaretto-specific
      # special case, and keeps PR sandboxes on the same code path as every
      # other deployment rather than a build-time one nothing else uses.
      - name: Build and push PR-tagged images
        run: |
          tag="pr-${{ inputs.pr_number }}"
          docker build -t "ghcr.io/quarantineal/${{ inputs.app }}-backend:${tag}" app/backend
          docker build -t "ghcr.io/quarantineal/${{ inputs.app }}-frontend:${tag}" app/frontend
          docker push "ghcr.io/quarantineal/${{ inputs.app }}-backend:${tag}"
          docker push "ghcr.io/quarantineal/${{ inputs.app }}-frontend:${tag}"

      # Data-driven, not app-name-driven: any future PR-sandboxed app that
      # sets needs_oidc: true in catalog.yaml picks up every step below
      # automatically, with no edit here.
      - name: Check whether this app needs OIDC
        id: oidc
        working-directory: ${{ env.QUARANTINE_REPO_PATH }}
        run: |
          git pull --ff-only
          needs_oidc="$(yq eval '.apps[] | select(.name == "${{ inputs.app }}") | .needs_oidc' catalog.yaml)"
          echo "needs_oidc=${needs_oidc}" >> "$GITHUB_OUTPUT"

      # bin/quarantine requires sops/age-keygen/yq on whatever machine runs
      # it. install.sh puts those on the VM itself, but this step runs
      # *inside* the ephemeral runner container (a bare myoung34/github-
      # runner image), which starts bare every job — see deploy-app.yml's
      # identical step for the checksum/version source of truth; keep both
      # in lockstep.
      - name: Install quarantine CLI dependencies
        if: steps.oidc.outputs.needs_oidc == 'true'
        run: |
          case "$(uname -m)" in
            x86_64) arch=amd64 ;;
            aarch64|arm64) arch=arm64 ;;
            *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac

          sops_version="3.13.3"
          yq_version="4.53.3"
          age_version="1.3.1"
          declare -A sops_sha256=( [amd64]="e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b" [arm64]="53b0abacd38ef1b12a66d6c100956691b9cefce018d91f81e73ddf7438b94d77" )
          declare -A yq_sha256=( [amd64]="fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4" [arm64]="578648e463a11c1b6db6010cbf41eafed6bee79466fcffa1bb446672cf7945ea" )
          declare -A age_sha256=( [amd64]="bdc69c09cbdd6cf8b1f333d372a1f58247b3a33146406333e30c0f26e8f51377" [arm64]="c6878a324421b69e3e20b00ba17c04bc5c6dab0030cfe55bf8f68fa8d9e9093a" )

          fetch_verified() {
            local url="$1" expected="$2" dest="$3" tmp actual
            tmp="$(mktemp)"
            curl -fsSL -o "$tmp" "$url"
            actual="$(sha256sum "$tmp" | awk '{print $1}')"
            [[ "$actual" == "$expected" ]] || { echo "checksum mismatch for ${url}: expected ${expected}, got ${actual}" >&2; exit 1; }
            chmod +x "$tmp"
            sudo mv "$tmp" "$dest"
          }

          fetch_verified "https://github.com/getsops/sops/releases/download/v${sops_version}/sops-v${sops_version}.linux.${arch}" "${sops_sha256[$arch]}" /usr/local/bin/sops
          fetch_verified "https://github.com/mikefarah/yq/releases/download/v${yq_version}/yq_linux_${arch}" "${yq_sha256[$arch]}" /usr/local/bin/yq

          age_tmp="$(mktemp -d)"
          age_tarball="${age_tmp}/age.tar.gz"
          curl -fsSL -o "$age_tarball" "https://github.com/FiloSottile/age/releases/download/v${age_version}/age-v${age_version}-linux-${arch}.tar.gz"
          actual="$(sha256sum "$age_tarball" | awk '{print $1}')"
          [[ "$actual" == "${age_sha256[$arch]}" ]] || { echo "checksum mismatch for age tarball: expected ${age_sha256[$arch]}, got ${actual}" >&2; exit 1; }
          tar xzf "$age_tarball" -C "$age_tmp"
          sudo mv "${age_tmp}/age/age" "${age_tmp}/age/age-keygen" /usr/local/bin/
          rm -rf "$age_tmp"

      - name: Bring up the sandbox
        working-directory: ${{ env.QUARANTINE_REPO_PATH }}
        env:
          BASE_DOMAIN: ${{ inputs.environment == 'dev' && 'dev.quarantine.al' || 'quarantine.al' }}
        run: |
          export SUBDOMAIN="pr-${{ inputs.pr_number }}-${{ inputs.app }}"
          export DOMAIN="${BASE_DOMAIN}"
          # Matches bin/quarantine's own <name> -> <APP>_VERSION convention
          # (tr '[:lower:]-' '[:upper:]_') — the compose fragment's
          # ${LAZARETTO_VERSION:-CHANGEME} is uppercase and interpolation
          # is case-sensitive, so a lowercase export here would silently
          # fall through to the CHANGEME placeholder image tag instead.
          version_var="$(printf '%s' "${{ inputs.app }}" | tr '[:lower:]-' '[:upper:]_')_VERSION"
          export "${version_var}=pr-${{ inputs.pr_number }}"

          compose_files=(-f "apps/first-party/${{ inputs.app }}/compose.yaml")
          if [[ "${{ steps.oidc.outputs.needs_oidc }}" == "true" ]]; then
            # Same project, second file: this PR's own oauth2-proxy-<app>
            # instance (SUBDOMAIN-templated) comes up and tears down
            # together with the app's own containers, scoped to the same
            # `--project-name`.
            compose_files+=(-f "infra/edge/oauth2-proxy/compose.yaml")
          fi

          # --env-file: without it, ${OIDC_CLIENT_ID_<APP>}/${OIDC_CLIENT_SECRET_<APP>}/
          # ${OAUTH2_PROXY_COOKIE_SECRET} in infra/edge/oauth2-proxy/compose.yaml
          # all resolve to blank strings (docker compose only substitutes from
          # the calling shell's own exported vars otherwise, and this step only
          # exports SUBDOMAIN/DOMAIN/<APP>_VERSION above) — confirmed live: the
          # sandbox's own oauth2-proxy-<subdomain> instance crash-looped with
          # "missing setting: cookie-secret ... client-id ... client-secret",
          # which was never caught before since no PR sandbox had needs_oidc:
          # true until Lazaretto — deploy-app.yml's own persistent-deployment
          # path never hits this: it only ever brings up the app's own
          # compose.yaml, never infra/edge/oauth2-proxy/compose.yaml (that
          # instance comes up through `quarantine start`'s own env handling
          # instead, a separate path this fix doesn't touch).
          docker compose \
            --project-name "pr-${{ inputs.pr_number }}-${{ inputs.app }}" \
            --env-file "environments/${{ inputs.environment }}/.env" \
            "${compose_files[@]}" \
            --profile "${{ inputs.app }}" \
            up -d

      - name: Register this PR's OIDC redirect URI
        if: steps.oidc.outputs.needs_oidc == 'true'
        working-directory: ${{ env.QUARANTINE_REPO_PATH }}
        env:
          QUARANTINE_CONFIG_FILE: /opt/quarantine/quarantine.yaml
          BASE_DOMAIN: ${{ inputs.environment == 'dev' && 'dev.quarantine.al' || 'quarantine.al' }}
        run: |
          ./bin/quarantine app add-redirect "${{ inputs.app }}" \
            "https://pr-${{ inputs.pr_number }}-${{ inputs.app }}.${BASE_DOMAIN}/oauth2/callback"

      - name: Comment preview URL on the PR
        uses: actions/github-script@v7
        env:
          BASE_DOMAIN: ${{ inputs.environment == 'dev' && 'dev.quarantine.al' || 'quarantine.al' }}
        with:
          script: |
            github.rest.issues.createComment({
              owner: 'QuarantineAl',
              repo: '${{ inputs.app }}',
              issue_number: ${{ inputs.pr_number }},
              body: `Preview: https://pr-${{ inputs.pr_number }}-${{ inputs.app }}.${process.env.BASE_DOMAIN}`
            })
