name: Build and push app images
description: >-
  Builds all of an app's images at once with `docker buildx bake` and pushes
  them to ghcr.io/quarantineal. Log in to GHCR before using it.

# Each image becomes ghcr.io/quarantineal/<app>-<name>, or just
# ghcr.io/quarantineal/<app> when name is empty, with one tag per line of
# `tags`.
#
# `images` is a JSON list. Every field but name is optional:
#   [{"name": "api", "context": ".", "file": "apps/api/Dockerfile",
#     "build_args": {"SITE_URL": "https://example"}}]
#   context     folder to build, relative to `root` (default ".")
#   file        Dockerfile, relative to context (default "Dockerfile")
#   build_args  extra build args; BUILD_SHA is always passed
#
# This uses the runner's default Docker driver on purpose: builds run on
# the host's daemon, so the layer cache survives between jobs. A
# docker-container builder would start with an empty cache every time.

inputs:
  app:
    description: App name, the image name prefix (e.g. "lazzaretto")
    required: true
  images:
    description: JSON list of images (see the comment at the top of this file)
    required: true
  tags:
    description: Tags to push, one per line (e.g. "dev" and the commit SHA)
    required: true
  build_sha:
    description: Commit SHA passed as the BUILD_SHA build arg
    required: true
  root:
    description: Folder the app repo is checked out in
    default: app

runs:
  using: composite
  steps:
    - shell: bash
      env:
        APP: ${{ inputs.app }}
        IMAGES: ${{ inputs.images }}
        TAGS: ${{ inputs.tags }}
        BUILD_SHA: ${{ inputs.build_sha }}
        ROOT: ${{ inputs.root }}
      run: |
        set -euo pipefail
        bake="${RUNNER_TEMP}/bake.json"
        jq -n --argjson images "$IMAGES" --arg app "$APP" --arg root "$ROOT" \
              --arg sha "$BUILD_SHA" --arg tags "$TAGS" '
          def target: (.name // "") | if . == "" then "app" else . end;
          def repo: "ghcr.io/quarantineal/" + $app + ((.name // "") | if . == "" then "" else "-" + . end);
          ($tags | split("\n") | map(select(length > 0))) as $t
          | {
              group: { default: { targets: [ $images[] | target ] } },
              target: ( [ $images[] | {
                key: target,
                value: {
                  context: ($root + "/" + (.context // ".")),
                  dockerfile: (.file // "Dockerfile"),
                  args: ({ BUILD_SHA: $sha } + (.build_args // {})),
                  tags: [ repo as $r | $t[] | $r + ":" + . ]
                }
              } ] | from_entries )
            }' > "$bake"
        echo "::group::bake file"; cat "$bake"; echo "::endgroup::"
        docker buildx bake --file "$bake" --push
